<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VizApp - Entrada al Sistema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colores Dark Mode (Default) */
            --primary: #7f13ec;
            --primary-light: #9d46ff;
            --bg: #0c080f;
            --card-bg: rgba(20, 13, 26, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --input-bg: rgba(255, 255, 255, 0.03);
            --shadow: rgba(0, 0, 0, 0.5);
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Variables Light Mode */
        body.light-mode {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: #e2e8f0;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --input-bg: #f1f5f9;
            --shadow: rgba(148, 163, 184, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.4s ease;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Elements */
        .bg-glow {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(127, 19, 236, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(60px);
        }

        .glow-1 { top: -10%; left: -10%; }
        .glow-2 { bottom: -10%; right: -10%; }

        /* --- Login Card --- */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px var(--shadow);
            z-index: 10;
            animation: cardAppear 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--text-main), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 0.6rem;
            margin-left: 0.25rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            opacity: 0.7;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg);
            box-shadow: 0 0 0 4px rgba(127, 19, 236, 0.1);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-dim);
            cursor: pointer;
        }

        .forgot-pass {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .forgot-pass:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(127, 19, 236, 0.3);
            margin-bottom: 1.5rem;
        }

        .btn-login:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(127, 19, 236, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }

        /* --- Theme Toggle --- */
        .theme-toggle-fixed {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            transition: var(--transition);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .theme-toggle-fixed:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

    </style>
</head>
<body class="dark-mode">

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <button class="theme-toggle-fixed" id="themeToggle" title="Cambiar tema">
        <svg class="moon-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
        <svg class="sun-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l.707.707M6.343 6.343l.707.707M12 5a7 7 0 100 14 7 7 0 000-14z"></path></svg>
    </button>

    <div class="login-card">
        <div class="logo-section">
            <h1 class="logo">VizApp</h1>
            <p class="subtitle">Visualización inteligente de infraestructuras</p>
        </div>

        <form onsubmit="return false;">
            <div class="form-group">
                <label class="label">Correo electrónico / Usuario</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <input type="text" placeholder="ejemplo@vizapp.com" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Contraseña</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    <input type="password" placeholder="••••••••" autocomplete="current-password">
                </div>
            </div>

            <div class="options">
                <label class="remember-me">
                    <input type="checkbox" style="width: 16px; height: 16px; padding: 0; margin: 0;">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="footer">
            ¿No tienes una cuenta? <a href="#">Regístrate gratis</a>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = themeToggle.querySelector('.sun-icon');
        const moonIcon = themeToggle.querySelector('.moon-icon');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            sunIcon.style.display = isLight ? 'block' : 'none';
            moonIcon.style.display = isLight ? 'none' : 'block';
            localStorage.setItem('login_theme', isLight ? 'light' : 'dark');
        });

        if (localStorage.getItem('login_theme') === 'light') {
            body.classList.add('light-mode');
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
        }
    </script>
</body>
</html>
